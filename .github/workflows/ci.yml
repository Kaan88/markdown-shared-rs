# Checks on every push to main, feat/linux or f/macos and every pull request: formatting, clippy
# (warnings are errors) and the tests, on Linux, Windows and Apple Silicon. Intel macOS runs
# only on pushes to main.
name: ci

on:
  push:
    branches: [main, feat/linux, f/macos]
  pull_request:
  workflow_dispatch:

concurrency:
  # A shared group can replace pending runs even with cancellation disabled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.99.1
  UI_FEATURES: recycle,media-session,notify,a11y,host,term

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check the catalogue
        run: bash .github/scripts/check-catalogue.sh
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config fonts-dejavu-core \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace
      - run: cargo clippy --release -p mdshared-ui --all-targets --features ${{ env.UI_FEATURES }} -- -D warnings
      # Keep a positional filter so Cargo skips doctests, as in the original filtered runs.
      - run: 'cargo test --release -p mdshared-ui --features ${{ env.UI_FEATURES }} recycle -- media_session notify a11y host:: termview'
      # Keep the host and its examples covered without the accessibility integration.
      - run: cargo clippy --release -p mdshared-ui --all-targets --features host -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features host host::'
      # Selecting UI and preview together would enable mdshared-app's defaults for preview.
      - run: cargo clippy --release -p mdshared-md-preview --features server --all-targets -- -D warnings
      - run: cargo test --release -p mdshared-md-preview --features server
      - run: cargo clippy --release -p mdshared-app --no-default-features --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace --no-fail-fast
      - run: cargo clippy --release -p mdshared-ui --all-targets --features ${{ env.UI_FEATURES }} -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features ${{ env.UI_FEATURES }} recycle -- media_session notify a11y host:: termview'
      - run: cargo clippy --release -p mdshared-ui --all-targets --features host -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features host host::'
      - run: cargo clippy --release -p mdshared-md-preview --features server --all-targets -- -D warnings
      - run: cargo test --release -p mdshared-md-preview --features server
      - run: cargo clippy --release -p mdshared-app --no-default-features --all-targets -- -D warnings
      # A smoke run of the host: a real window, a few frames, closed on its timer.
      - run: cargo run --release -p mdshared-ui --features host,a11y --example host -- --seconds 2

  macos:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["aarch64","x86_64"]' || '["aarch64"]') }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace --no-fail-fast
      - run: cargo clippy --release -p mdshared-ui --all-targets --features ${{ env.UI_FEATURES }} -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features ${{ env.UI_FEATURES }} recycle -- media_session notify a11y host:: termview'
      - run: cargo clippy --release -p mdshared-ui --all-targets --features host -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features host host::'
      - run: cargo clippy --release -p mdshared-md-preview --features server --all-targets -- -D warnings
      - run: cargo test --release -p mdshared-md-preview --features server
      - run: cargo clippy --release -p mdshared-app --no-default-features --all-targets -- -D warnings
