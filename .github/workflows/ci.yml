# Checks on every push to main, feat/linux or f/macos and every pull request: formatting, clippy
# (warnings are errors) and the tests, on Linux, on real Windows and on real Macs (Apple Silicon
# and Intel). See docs/CI.md.
# The Recycle Bin (feature `recycle`), the media session (feature `media-session`), the
# notifications (feature `notify`), the accessibility tree (feature `a11y`) and the window host
# (feature `host`, alone and with `a11y`), off in the workspace build, are built and tested on
# their own.
name: ci

on:
  push:
    branches: [main, feat/linux, f/macos]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.99.1

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check the catalogue
        run: bash .github/scripts/check-catalogue.sh
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config fonts-dejavu-core \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace
      - run: cargo clippy --release -p mdshared-ui --all-targets --features recycle -- -D warnings
      - run: cargo test --release -p mdshared-ui --features recycle recycle
      - run: cargo clippy --release -p mdshared-ui --all-targets --features media-session -- -D warnings
      - run: cargo test --release -p mdshared-ui --features media-session media_session
      - run: cargo clippy --release -p mdshared-ui --all-targets --features notify -- -D warnings
      - run: cargo test --release -p mdshared-ui --features notify notify
      - run: cargo clippy --release -p mdshared-ui --features a11y --all-targets -- -D warnings
      - run: cargo test --release -p mdshared-ui --features a11y a11y
      - run: cargo clippy --release -p mdshared-ui --all-targets --features host -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features host host::'
      - run: cargo clippy --release -p mdshared-ui --all-targets --features host,a11y -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features host,a11y host::'
      - run: cargo clippy --release -p mdshared-ui --all-targets --features term -- -D warnings
      - run: cargo test --release -p mdshared-ui --features term termview
      - run: cargo clippy --release -p mdshared-md-preview --features server --all-targets -- -D warnings
      - run: cargo test --release -p mdshared-md-preview --features server
      - run: cargo clippy --release -p mdshared-app --no-default-features --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace --no-fail-fast
      - run: cargo clippy --release -p mdshared-ui --all-targets --features recycle -- -D warnings
      - run: cargo test --release -p mdshared-ui --features recycle recycle
      - run: cargo clippy --release -p mdshared-ui --all-targets --features media-session -- -D warnings
      - run: cargo test --release -p mdshared-ui --features media-session media_session
      - run: cargo clippy --release -p mdshared-ui --all-targets --features notify -- -D warnings
      - run: cargo test --release -p mdshared-ui --features notify notify
      - run: cargo clippy --release -p mdshared-ui --features a11y --all-targets -- -D warnings
      - run: cargo test --release -p mdshared-ui --features a11y a11y
      - run: cargo clippy --release -p mdshared-ui --all-targets --features host -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features host host::'
      - run: cargo clippy --release -p mdshared-ui --all-targets --features host,a11y -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features host,a11y host::'
      - run: cargo clippy --release -p mdshared-ui --all-targets --features term -- -D warnings
      - run: cargo test --release -p mdshared-ui --features term termview
      - run: cargo clippy --release -p mdshared-md-preview --features server --all-targets -- -D warnings
      - run: cargo test --release -p mdshared-md-preview --features server
      - run: cargo clippy --release -p mdshared-app --no-default-features --all-targets -- -D warnings
      # A smoke run of the host: a real window, a few frames, closed on its timer.
      - run: cargo run --release -p mdshared-ui --features host,a11y --example host -- --seconds 2

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace --no-fail-fast
      - run: cargo clippy --release -p mdshared-ui --all-targets --features recycle -- -D warnings
      - run: cargo test --release -p mdshared-ui --features recycle recycle
      - run: cargo clippy --release -p mdshared-ui --all-targets --features media-session -- -D warnings
      - run: cargo test --release -p mdshared-ui --features media-session media_session
      - run: cargo clippy --release -p mdshared-ui --all-targets --features notify -- -D warnings
      - run: cargo test --release -p mdshared-ui --features notify notify
      - run: cargo clippy --release -p mdshared-ui --features a11y --all-targets -- -D warnings
      - run: cargo test --release -p mdshared-ui --features a11y a11y
      - run: cargo clippy --release -p mdshared-ui --all-targets --features host -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features host host::'
      - run: cargo clippy --release -p mdshared-ui --all-targets --features host,a11y -- -D warnings
      - run: 'cargo test --release -p mdshared-ui --features host,a11y host::'
      - run: cargo clippy --release -p mdshared-ui --all-targets --features term -- -D warnings
      - run: cargo test --release -p mdshared-ui --features term termview
      - run: cargo clippy --release -p mdshared-md-preview --features server --all-targets -- -D warnings
      - run: cargo test --release -p mdshared-md-preview --features server
      - run: cargo clippy --release -p mdshared-app --no-default-features --all-targets -- -D warnings
