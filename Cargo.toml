[workspace]
resolver = "3"
members = ["crates/mdshared-app", "crates/mdshared-ui", "crates/mdshared-text", "crates/mdshared-highlight", "crates/mdshared-fetch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
