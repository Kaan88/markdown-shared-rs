[workspace]
resolver = "3"
members = [
    "crates/mdshared-app",
    "crates/mdshared-ui",
    "crates/mdshared-text",
    "crates/mdshared-highlight",
    "crates/mdshared-fetch",
    "crates/mdshared-term",
    "crates/mdshared-pty",
    "crates/mdshared-md-core",
    "crates/mdshared-md-engine-proto",
    "crates/mdshared-md-engine",
    "crates/mdshared-md-render",
    "crates/mdshared-md-preview",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
pulldown-cmark = { version = "=0.13.6", default-features = false }
merman = { version = "=0.9.3", default-features = false, features = [
    "svg",
    "diagram-flowchart",
    "diagram-sequence",
    "diagram-class",
    "diagram-state",
    "diagram-er",
    "diagram-gantt",
    "diagram-pie",
    "diagram-mindmap",
    "diagram-agentflow",
    "diagram-block",
    "diagram-c4",
    "diagram-cynefin",
    "diagram-event-modeling",
    "diagram-git-graph",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-packet",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-xychart",
    "diagram-zenuml",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
