[package]
name = "mdshared-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mdshared-app = { path = "../mdshared-app" }
mdshared-text = { path = "../mdshared-text" }
parley = "=0.12.0"
# The rasterizer swash already brings in; it strokes the icons.
zeno = "=0.3.3"

[target.'cfg(windows)'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
rfd = { version = "0.15.4", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

# Linux is not built or run yet; these are the features it will need.
[target.'cfg(not(windows))'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
# The settings portal, for the system's colour scheme. The same zbus the file dialogs bring in.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# The compositor-drawn shadow of undecorated windows (src/shadow.rs). KDE's own protocol: the same
# crates winit and softbuffer already bring in, here named so the shadow can talk to the
# compositor on its own event queue.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
