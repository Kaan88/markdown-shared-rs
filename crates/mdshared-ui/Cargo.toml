[package]
name = "mdshared-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mdshared-app = { path = "../mdshared-app" }
mdshared-text = { path = "../mdshared-text" }
parley = "=0.12.0"
# The rasterizer swash already brings in; it strokes the icons.
zeno = "=0.3.3"
# The Recycle Bin (`platform::recycle`, D-046), only for an application that turns on the feature
# `recycle`. Without its default features: its date crate `jiff` is left out, and everything else
# it needs is already in the lock at versions it accepts.
trash = { version = "=5.4.0", default-features = false, features = ["coinit_apartmentthreaded", "freedesktop"], optional = true }
# Accessibility (W8, the owner's decision 2026-11-24): AccessKit's tree, only with the `a11y`
# feature. Pure Rust with no system library, so the tree builds on every system; only the adapter
# that serves it (accesskit_winit, below) is Windows-only.
accesskit = { version = "=0.25.2", optional = true }

[target.'cfg(windows)'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
rfd = { version = "0.15.4", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
] }
# The winit adapter of the accessibility tree (W8, `a11y`): Windows only for now (UI Automation,
# Purge's scope). Its default features (AT-SPI over zbus and async-io, winit's X11 and Wayland) are
# left out. The tree itself (`accesskit`) is plain Rust and is in [dependencies].
accesskit_winit = { version = "=0.34.2", optional = true, default-features = false, features = ["rwh_06"] }
# The system's media controls (src/media_session/smtc.rs) and toasts (src/notify/toast.rs), only
# with the media-session or the notify feature.
windows = { version = "=0.62.2", optional = true, features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
# The settings portal, for the system's colour scheme. The same zbus the file dialogs bring in.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# The compositor-drawn shadow of undecorated windows (src/shadow.rs). KDE's own protocol: the same
# crates winit and softbuffer already bring in, here named so the shadow can talk to the
# compositor on its own event queue.
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# The X11 route of the client-drawn margin (src/shadow/x11.rs): a second connection that sets
# `_GTK_FRAME_EXTENTS` and the input shape. The same x11rb winit already brings in.
x11rb = { version = "0.13.2", optional = true, default-features = false, features = ["shape"] }

# macOS: AppKit through winit and rfd; the colour scheme comes from winit's theme.
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
# The menu bar (src/menu_bar.rs). The version arboard and rfd already bring in.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSResponder", "NSScreen", "NSGraphics", "NSWorkspace", "NSAccessibility", "NSDocumentController"] }
rfd = { version = "0.15.4", default-features = false }
arboard = { version = "3", default-features = false }
# The appearance setting (dark mode) from the user defaults. The version winit's AppKit side and
# rfd already bring in.
# The open-documents Apple Event (src/open_documents.rs). The versions winit's AppKit side and rfd
# already bring in.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults", "NSAppleEventManager", "NSAppleEventDescriptor", "NSURL", "NSValue", "NSDictionary", "NSGeometry", "NSNotification", "objc2-core-services"] }

# The window of examples/purge_shape.rs; the applications bring their own.
[target.'cfg(windows)'.dev-dependencies]
softbuffer = { version = "=0.4.8", default-features = false }

[target.'cfg(target_os = "linux")'.dev-dependencies]
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }

[features]
# The client-drawn shadow margin (Wayland any compositor, X11): needs the patched winit (a content
# margin on the Wayland window) and, in the app, the patched softbuffer (alpha on Wayland); see
# docs/LINUX.md. Off: the crate builds against stock winit and uses KWin's protocol only.
client-margin = ["dep:x11rb"]
# The Recycle Bin: `platform::recycle`, `platform::recycle_refusal` and `platform::open_recycle_bin`
# (D-046). Off: the crate is not built, and nothing of it is in the application. mdview leaves it
# off; mdedit turns it on.
recycle = ["dep:trash", "windows-sys/Win32_Storage_FileSystem"]
# The system's now-playing surface and media keys: `media_session::MediaSession` (roadmap M1).
# On Windows the SystemMediaTransportControls (the windows crate's WinRT); on Linux an MPRIS
# service on the session bus (the zbus already there). Off: `MediaSession::new` answers
# Unsupported, and the model types are still there.
media-session = ["dep:windows"]
# System notifications: `notify::Notifier` (roadmap W7). On Windows toasts through
# ToastNotificationManager (the windows crate's WinRT), under an AppUserModelID written to the
# current user's registry; on Linux the desktop's notification server over the zbus already
# there. Off: `Notifier::new` answers Unsupported, and the model types are still there.
notify = ["dep:windows", "windows?/Data_Xml_Dom", "windows?/UI_Notifications"]
# Accessibility: `a11y::*` builds an AccessKit tree from the widgets' models, and the window's
# adapter serves it to UI Automation (roadmap W8). The tree builds on every system; the adapter
# (accesskit_winit) is there on Windows only, so elsewhere nothing serves the tree yet.
a11y = ["dep:accesskit", "dep:accesskit_winit"]

[[example]]
name = "purge_shape"
required-features = ["a11y"]
