[package]
name = "mdshared-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["full"]
# With default features off, parsing needs only notes, wiki-links and their file/path helpers.
full = ["dep:libc", "dep:notify", "dep:windows-sys"]

[[test]]
name = "crash_hook"
path = "tests/crash_hook.rs"
required-features = ["full"]

[[example]]
name = "crash"
path = "examples/crash.rs"
required-features = ["full"]

[dependencies]
notify = { version = "=8.2.1", default-features = false, optional = true }

# Use the workspace's existing libc version for Unix file flags and handle operations.
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", optional = true }

# Windows: the unhandled-exception filter of the crash reports; the named mutex, its record (a
# file mapping), the windows and WM_COPYDATA of `single_mutex`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows tests: `single_mutex`'s test window registers a class of its own, which needs GDI's types;
# `dirlist`'s junction test sets the link's own hidden attribute.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

# macOS: the FSEvents backend (Linux uses inotify, Windows ReadDirectoryChangesW, with no feature).
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "=8.2.1", default-features = false, features = ["macos_fsevent"], optional = true }
