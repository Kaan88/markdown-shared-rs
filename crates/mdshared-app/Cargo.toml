[package]
name = "mdshared-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
notify = { version = "=8.2.1", default-features = false }

# Windows: the unhandled-exception filter of the crash reports; the named mutex, its record (a
# file mapping), the windows and WM_COPYDATA of `single_mutex`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows tests: `single_mutex`'s test window registers a class of its own, which needs GDI's types.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Graphics_Gdi"] }

# macOS: the FSEvents backend (Linux uses inotify, Windows ReadDirectoryChangesW, with no feature).
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "=8.2.1", default-features = false, features = ["macos_fsevent"] }
