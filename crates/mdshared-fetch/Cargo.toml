[package]
name = "mdshared-fetch"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Downloads for the Markdown apps: WinHTTP on Windows, a disk cache, strict limits."

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }

# Loads the system libcurl at run time (no link-time dependency on it).
[target.'cfg(not(windows))'.dependencies]
libloading = "0.8"
