[package]
name = "mdshared-md-preview"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "mdview's page drawn for another window: the wire format an editor speaks to `mdview --preview-server`, and (feature `server`) the loop that answers it, run in mdview's process or in the editor's own."

[features]
default = []
# The loop that draws: mdview has it, and an editor that draws the page itself.
server = ["dep:mdshared-md-core", "dep:mdshared-md-render"]

[dependencies]
mdshared-md-core = { path = "../mdshared-md-core", optional = true }
mdshared-md-render = { path = "../mdshared-md-render", optional = true }
